[package]
name = "host"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "kio"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[features]
# Test-only hooks; never enabled in the shipped binary.
test-hooks = []

[dependencies]
cap-std = "4"
http-body-util = "0.1.5"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
lang = { path = "../lang" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "signal", "sync", "time"] }
ureq = "3"
url = "2"
wasmtime = "50"
wasmtime-wasi = "50"

[build-dependencies]
wasmtime = "50"

[dev-dependencies]
host = { path = ".", features = ["test-hooks"] }
tempfile = "3"
