[package]
name = "kio"
version = "0.1.1"
edition = "2021"
publish = false

[[bin]]
name = "kio"
path = "src/main.rs"

[lib]
name = "kio_host"
path = "src/lib.rs"

[features]
# Test-only hooks; never enabled in the shipped binary.
test-hooks = []

[dependencies]
cap-std = "4"
codegen = { path = "../codegen" }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
getrandom = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
lang = { path = "../lang" }
rand_chacha = "0.10.0"
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled", "hooks", "limits"] }
rustix = { version = "1", default-features = false, features = ["fs", "process"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
ureq = "3"
url = "2"
wasmparser = "0.261"
wasmtime = { version = "50", default-features = false, features = ["anyhow", "backtrace", "component-model", "cranelift", "demangle", "addr2line", "parallel-compilation", "pooling-allocator", "runtime", "std"] }

[dev-dependencies]
kio = { path = ".", features = ["test-hooks"] }
kiogen = { path = "../tools/kiogen" }
tempfile = "3"
tokio-tungstenite = { version = "0.30", features = ["connect"] }
