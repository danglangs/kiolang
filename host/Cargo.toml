[package]
name = "host"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "kio"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[features]
# Test-only hooks; never enabled in the shipped binary.
test-hooks = []

[dependencies]
cap-std = "4"
wasmtime = "50"
wasmtime-wasi = "50"

[dev-dependencies]
host = { path = ".", features = ["test-hooks"] }
lang = { path = "../lang" }
tempfile = "3"
