# The Rust versions of the benchmarks: one binary each. Outside the workspace.
[package]
name = "kio-bench-rust"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }

[profile.release]
opt-level = 3
