name: pages
# Builds the site on every push that touches it. Deploys only once the repo
# variable PAGES_ENABLED is "true" (set it after turning Pages on, source:
# GitHub Actions), so until then a run is green and deploys nothing.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - README.md
      - docs/first-job.md
      - docs/guide.md
      - docs/language.md
      - docs/primer.md
      - docs/assets/**
      - lang/**
      - tools/playground/**
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The playground's checker; the runner's rustup, as no other step needs a toolchain action.
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo build -p playground --release --target wasm32-unknown-unknown
      - run: python3 site/build.py _site
      - if: vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
