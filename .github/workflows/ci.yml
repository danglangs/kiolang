name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo clippy -p runtime --target wasm32-unknown-unknown --features test-heap -- -D warnings
      - run: cargo build -p runtime --target wasm32-unknown-unknown --release
      - run: cargo test -p codegen
      - run: cargo run -p capgen && git diff --exit-code lang/src/caps_gen.rs
