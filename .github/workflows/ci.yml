name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build -p kio && KIO=target/debug/kio eval/check_refs.sh
      - run: KIO=target/debug/kio python3 -m unittest discover tools/kio-py/tests
      - run: cargo clippy -p runtime --target wasm32-unknown-unknown --features test-heap -- -D warnings
      - run: cargo build -p runtime --target wasm32-unknown-unknown --release
      - run: cargo test -p codegen
      - run: cargo run -p capgen && git diff --exit-code lang/src/caps_gen.rs
  e3:
    # E3's references and detectors; the Python arm's sandbox is macOS sandbox-exec.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # The Python the self-test passes on locally; the image's default python3 is a newer one.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 --version && cargo build --release -p kio
      # One task first: a broken Python arm fails here in a minute, with its stderr.
      - run: eval/e3/run.py --selftest --kio target/release/kio --tasks 01 --jobs 1
      - run: eval/e3/run.py --selftest --kio target/release/kio
  first-job:
    # docs/first-job.md followed with the Linux release archive in a container without Rust.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: tools/release-build.sh x86_64-unknown-linux-musl
      - run: >
          docker run --rm --network none -v "$PWD:/src:ro" python:3.12-slim-bookworm
          python3 /src/tools/first-job-test.py /src/dist/kio-x86_64-unknown-linux-musl.tar.gz /src/docs/first-job.md
  perf:
    # bench/gate.py: each benchmark's fuel and peak memory against bench/baseline.json (docs/perf.md).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --release -p kio
      - run: python3 bench/gen_data.py
      # A push's head commit message, or a pull request's title and body: `perf-ok: <row>` waives a row.
      - run: python3 bench/gate.py --message "$COMMIT $TITLE $BODY"
        env:
          COMMIT: ${{ github.event.head_commit.message }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
